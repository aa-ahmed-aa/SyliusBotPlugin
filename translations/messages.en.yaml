            token_invalid_help: Facebook no longer accepts this page's access. This happens when the app is removed from the Page or the admin's password changes. Log in with Facebook and connect the page again.
            not_subscribed: Not receiving messages
            not_subscribed_help: The page is connected but Meta is not sending its messages to the store. Use Repair to subscribe it again.
            unknown: Status unknown
            unknown_help: Facebook could not be asked about this page right now.

        no_pages:
            title: Facebook lists no Pages for this account
            body: '%name% is logged in, but Facebook returned no Page it can manage.'
            step1: Make sure this Facebook account is an admin of the Page, not just of a Business portfolio that owns it.
            step2: Log out of Facebook here and log in again, and select the Pages when Facebook asks which ones to share.
            step3: If the app was removed from the account, open Business integrations and remove it, then log in again.
            business_integrations: Open Business integrations

        not_configured:
            title: The Meta app is not configured
            body: Set your Meta app's credentials in the environment of the store, then reload this page.

        setup:
            title: Meta app setup
            intro:
                messenger: In your Meta app, add the Messenger product, then use these values.
                instagram: In your Meta app, add Instagram (Messenger API for Instagram), then use these values.
            callback_url: Webhook callback URL
            callback_url_help:
                messenger: 'Subscribe the "page" object to the messages and messaging_postbacks fields. Use your FACEBOOK_VERIFICATION value as the verify token.'
                instagram: 'Subscribe the "instagram" object to the messages and messaging_postbacks fields. Use your FACEBOOK_VERIFICATION value as the verify token.'
            redirect_uri: Valid OAuth redirect URI
            redirect_uri_help: Add it under Facebook Login › Settings so "Continue with Facebook" can come back here.
            guide: Step-by-step setup guide

